[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ireo-clinical-intelligence"
version = "1.0.0"
description = "Clinical intelligence platform for IREO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "python-dotenv",
    "playwright>=1.61,<2",
    "requests",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.15,<8",
    "pytest>=9,<10",
]

[project.scripts]
ireo-clinical-intelligence = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
