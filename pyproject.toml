[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ireo-clinical-intelligence"
version = "0.1.0"
description = "Clinical intelligence platform for IREO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
ireo-clinical-intelligence = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
